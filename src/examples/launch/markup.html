<main class="panel" aria-label="Mission control">
  <header class="plate">
    <span class="title">Flight console 3</span>
    <span class="status"><span class="lamp" aria-hidden="true"></span><span class="state">SAFE</span></span>
  </header>

  <section class="station">
    <div class="guard">
      <button class="launch" type="button" disabled>Launch</button>
      <button class="cover" type="button" aria-label="Safety cover" aria-pressed="false"></button>
    </div>
    <p class="hint">Lift the cover, then launch</p>
  </section>

  <footer class="readouts">
    <p class="readout"><span class="label">Launches</span><output class="count">00</output></p>
    <p class="readout"><span class="label">Particles</span><output class="particles">000</output></p>
  </footer>
</main>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
