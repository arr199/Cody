<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/images/favicon_io/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/style.css">
  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
  <title>Cody-Studio</title>
  <!-- Apply saved theme before paint to avoid a flash. Keep in sync with src/ui/preferences.js -->
  <script>
    (function () {
      var t = 'vs-dark'
      try { t = localStorage.getItem('cody-editor-theme') || t } catch (e) {}
      var app = (t === 'vs' || t === 'hc-light') ? 'light' : 'dark'
      document.documentElement.setAttribute('data-theme', app)
    })()
  </script>
</head>

<body>
  <header>
    <!--  LEFT BAR -->
    <nav class="left-navbar">
      <!-- BRAND -->
      <div class="config-icon">
          <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-gear" viewBox="0 0 16 16">
            <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
          </svg>
          <span>Cody</span>
      </div>

      <!-- EXAMPLES (options are rendered from src/examples) -->
      <div id="examples-button-container" class="btn-containers">
        <button id="examples-button" class="left-navbar-buttons" aria-expanded="false" aria-controls="examples-menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-collection" viewBox="0 0 16 16">
            <path d="M2.5 3.5a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-11zm2-2a.5.5 0 0 1 0-1h7a.5.5 0 0 1 0 1h-7zM0 13a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 16 13V6a1.5 1.5 0 0 0-1.5-1.5h-13A1.5 1.5 0 0 0 0 6v7zm1.5.5A.5.5 0 0 1 1 13V6a.5.5 0 0 1 .5-.5h13a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-.5.5h-13z"/>
          </svg>
          <span class="button-label">Examples</span>
        </button>
        <div id="examples-menu" class="drop-down-menu-container examples-menu" hidden></div>
      </div>

      <!-- FONT SIZE -->
      <div id="font-size-button-container" class="btn-containers">
        <button id="font-size-button" class="left-navbar-buttons" aria-expanded="false" aria-controls="font-size-menu">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" fill="currentcolor" viewBox="0 -960 960 960" width="24"><path d="M560-160v-520H360v-120h520v120H680v520H560Zm-360 0v-320H80v-120h360v120H320v320H200Z"/></svg>
          <span class="button-label">Font-Size</span>
        </button>
        <div id="font-size-menu" class="drop-down-menu-container" hidden>
          <button type="button" data-value="14">14 px</button>
          <button type="button" data-value="15">15 px</button>
          <button type="button" data-value="16">16 px</button>
          <button type="button" data-value="17">17 px</button>
          <button type="button" data-value="18">18 px</button>
          <button type="button" data-value="19">19 px</button>
          <button type="button" data-value="20">20 px</button>
        </div>
      </div>
      <!-- THEME -->
      <div id="theme-button-container" class="btn-containers">
        <button id="theme-button" class="left-navbar-buttons" aria-expanded="false" aria-controls="theme-menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-palette" viewBox="0 0 16 16">
            <path d="M8 5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm4 3a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM5.5 7a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm.5 6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/>
            <path d="M16 8c0 3.15-1.866 2.585-3.567 2.07C11.42 9.763 10.465 9.473 10 10c-.603.683-.475 1.819-.351 2.92C9.826 14.495 9.996 16 8 16a8 8 0 1 1 8-8zm-8 7c.611 0 .654-.171.655-.176.078-.146.124-.464.07-1.119-.014-.168-.037-.37-.061-.591-.052-.464-.112-1.005-.118-1.462-.01-.707.083-1.61.704-2.314.369-.417.845-.578 1.272-.618.404-.038.812.026 1.16.104.343.077.702.186 1.025.284l.028.008c.346.105.658.199.953.266.653.148.904.083.991.024C14.717 9.38 15 9.161 15 8a7 7 0 1 0-7 7z"/>
          </svg>
          <span class="button-label">Theme</span>
        </button>
        <div id="theme-menu" class="drop-down-menu-container" hidden>
          <button type="button" data-value="vs-dark">Dark</button>
          <button type="button" data-value="vs">Light</button>
          <button type="button" data-value="hc-black">High Contrast Dark</button>
          <button type="button" data-value="hc-light">High Contrast Light</button>
        </div>
      </div>
      <!-- COPY URL -->
      <div id="copy-url-button-container" class="btn-containers">
        <button id="copy-url-button" class="left-navbar-buttons">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V2Zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H6ZM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1H2Z"/>
          </svg>
          <span class="button-label">Copy URL</span>
        </button>
      </div>
    </nav>
  </header>
  <main id="workspace" class="workspace" data-language="js" data-panel="preview">
    <section class="pane editor-pane" aria-label="Code editors">
      <div class="editor-tabs" role="tablist" aria-label="Editor language">
        <button type="button" role="tab" id="tab-html" data-language="html" aria-controls="html-editor" aria-selected="false" tabindex="-1">HTML<span class="error-dot" hidden></span></button>
        <button type="button" role="tab" id="tab-css" data-language="css" aria-controls="css-editor" aria-selected="false" tabindex="-1">CSS<span class="error-dot" hidden></span></button>
        <button type="button" role="tab" id="tab-js" data-language="js" aria-controls="js-editor" aria-selected="true" tabindex="0">JS<span class="error-dot" hidden></span></button>
      </div>
      <div id="html-editor" class="editor" role="tabpanel" aria-labelledby="tab-html">
        <img alt="" class="icons" src="/images/html.png">
      </div>
      <div id="css-editor" class="editor" role="tabpanel" aria-labelledby="tab-css">
        <img alt="" class="icons" src="/images/css.png">
      </div>
      <div id="js-editor" class="editor" role="tabpanel" aria-labelledby="tab-js">
        <img alt="" class="icons" src="/images/js.png">
      </div>
    </section>

    <div class="handle handle-split" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize the editor and preview"></div>

    <section class="pane preview-pane" aria-label="Preview">
      <div class="device-toolbar" role="toolbar" aria-label="Preview size">
        <div class="device-presets" role="group" aria-label="Device width">
          <button type="button" data-width="375" aria-pressed="false">Phone</button>
          <button type="button" data-width="768" aria-pressed="false">Tablet</button>
          <button type="button" data-width="full" aria-pressed="true">Full</button>
        </div>
        <span class="frame-readout"></span>
        <span class="toolbar-spacer"></span>
        <button type="button" class="preview-action" id="fullscreen-button">Fullscreen</button>
        <button type="button" class="preview-action" id="open-tab-button">Open in new tab</button>
      </div>
      <div class="preview-stage">
        <div class="preview-frame">
          <!-- Sandboxed without allow-same-origin: shared links run third-party code -->
          <iframe title="Website Preview" id="page" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
          <div class="handle handle-frame" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize the preview width"></div>
        </div>
      </div>
    </section>

    <div class="handle handle-console" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize the console"></div>

    <section id="console" class="pane console" aria-label="Console"></section>

    <nav class="mobile-tabs" role="tablist" aria-label="Panels">
      <button type="button" role="tab" data-language="html" aria-controls="html-editor" aria-selected="false" tabindex="-1">HTML<span class="error-dot" hidden></span></button>
      <button type="button" role="tab" data-language="css" aria-controls="css-editor" aria-selected="false" tabindex="-1">CSS<span class="error-dot" hidden></span></button>
      <button type="button" role="tab" data-language="js" aria-controls="js-editor" aria-selected="false" tabindex="-1">JS<span class="error-dot" hidden></span></button>
      <button type="button" role="tab" data-panel="preview" aria-controls="page" aria-selected="true" tabindex="0">Preview</button>
      <button type="button" role="tab" data-panel="console" aria-controls="console" aria-selected="false" tabindex="-1">Console</button>
    </nav>
  </main>

  <!-- COPY URL / OPEN TAB POP UP -->
  <div id="url-copy-container" class="url-copy-container" role="status" aria-live="polite">
    <span>URL Copied to Clipboard</span>
  </div>

  <script type="module" src="/main.js">
  </script>
</body>

</html>
